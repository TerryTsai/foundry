services:
  ticket:
    build: ./ticket
    restart: unless-stopped
    environment:
      TICKET_PORT: "3002"
      DB_PATH: /data/ticket.db
    volumes:
      - ticket-data:/data

  project:
    build: ./project
    restart: unless-stopped
    environment:
      PROJECT_PORT: "3001"
      DB_PATH: /data/project.db
      TICKET_URL: http://ticket:3002
      AGENT_URL: http://agent:3005
    volumes:
      - project-data:/data
    depends_on:
      - ticket
      - agent

  repo:
    build: ./repo
    restart: unless-stopped
    environment:
      REPO_PORT: "3003"
      REPO_BASE: /repos
    volumes:
      - /home/terry/repos:/repos

  sandbox:
    build: ./sandbox
    restart: unless-stopped
    privileged: true
    environment:
      SANDBOX_PORT: "3004"
      DB_PATH: /data/sandbox.db
    volumes:
      - sandbox-data:/data
      - sandbox-images:/var/lib/containers

  agent:
    build: ./agent
    restart: unless-stopped
    environment:
      AGENT_PORT: "3005"
      DB_PATH: /data/agent.db
      TICKET_URL: http://ticket:3002
      SANDBOX_URL: http://sandbox:3004
      REPO_URL: http://repo:3003
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - agent-data:/data

  web:
    build: ./web
    restart: unless-stopped

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - ticket
      - project
      - repo
      - sandbox
      - agent
      - web

volumes:
  ticket-data:
  project-data:
  sandbox-data:
  sandbox-images:
  agent-data:
