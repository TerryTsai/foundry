<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundry Foundational Data Model</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
  svg { width: 100vw; height: 100vh; }
  .entity { cursor: grab; }
  .entity:active { cursor: grabbing; }
  .entity-box { rx: 6; ry: 6; stroke-width: 1; }
  .entity-header { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
  .entity-field { font-size: 10px; font-family: 'JetBrains Mono', 'Fira Code', monospace; fill: #888; }
  .entity-field.pk { fill: #d4a840; }
  .entity-field.fk { fill: #5a8ab5; }
  .entity-field-type { fill: #555; }
  .service-badge { font-size: 8px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; fill: #444; }
  .relation-line { fill: none; stroke-width: 1; opacity: 0.3; }
  .relation-line:hover { opacity: 0.8; stroke-width: 2; }
  .relation-label { font-size: 8px; fill: #555; font-family: 'JetBrains Mono', monospace; }
  marker path { stroke: none; }
  .legend { font-size: 9px; font-family: 'JetBrains Mono', monospace; }
  #title { font-size: 14px; fill: #ccc; font-weight: 700; letter-spacing: 1.5px; }
  #subtitle { font-size: 10px; fill: #444; letter-spacing: 0.5px; font-family: 'JetBrains Mono', monospace; }
  .law-ref { font-size: 8px; fill: #333; font-family: 'JetBrains Mono', monospace; }
  .divider { stroke: #1a1a2a; stroke-width: 0.5; }
</style>
</head>
<body>
<svg id="canvas">
  <defs>
    <marker id="arrow-project" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,3 L0,6 Z" fill="#3a7a4a"/></marker>
    <marker id="arrow-ticket" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,3 L0,6 Z" fill="#3a6a9a"/></marker>
    <marker id="arrow-agent" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,3 L0,6 Z" fill="#6a4a9a"/></marker>
    <marker id="arrow-sandbox" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,3 L0,6 Z" fill="#9a6a3a"/></marker>
    <marker id="arrow-cross" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,3 L0,6 Z" fill="#555"/></marker>
    <marker id="dot-project" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2" fill="#3a7a4a"/></marker>
    <marker id="dot-ticket" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2" fill="#3a6a9a"/></marker>
    <marker id="dot-agent" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2" fill="#6a4a9a"/></marker>
    <marker id="dot-sandbox" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2" fill="#9a6a3a"/></marker>
    <marker id="dot-cross" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2" fill="#555"/></marker>
  </defs>

  <g id="scene">
    <g id="relationships"></g>
    <g id="entities"></g>
  </g>

  <text id="title" x="24" y="28">FOUNDRY FOUNDATIONAL DATA MODEL</text>
  <text id="subtitle" x="24" y="44">5 services  /  4 databases  /  7 tables  /  0 derived columns</text>

  <g class="legend" transform="translate(24, 62)">
    <circle cx="0" cy="0" r="3" fill="#d4a840"/>
    <text x="8" y="3" fill="#d4a840">pk (nanoid)</text>
    <circle cx="90" cy="0" r="3" fill="#5a8ab5"/>
    <text x="98" y="3" fill="#5a8ab5">fk ({table}_id)</text>
    <line x1="200" y1="0" x2="222" y2="0" stroke="#666" stroke-width="1"/>
    <text x="228" y="3" fill="#555">intra-service fk</text>
    <line x1="340" y1="0" x2="362" y2="0" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="368" y="3" fill="#555">cross-service (logical)</text>
  </g>
</svg>

<script>
const ROW_H = 16;
const HEADER_H = 30;
const PAD = 10;
const TYPE_X = 175;
const COL_W = 300;

const entities = [
  // ── PROJECT SERVICE ──
  {
    id: 'project',
    table: 'project',
    service: 'project :3001',
    color: '#3a7a4a',
    x: 40, y: 120,
    fields: [
      { name: 'id', type: 'TEXT NOT NULL', pk: true },
      { name: 'name', type: 'TEXT NOT NULL' },
      { name: 'status', type: "TEXT NOT NULL DEFAULT 'active'" },
      { name: 'schedule_interval', type: 'INTEGER NOT NULL DEFAULT 600' },
      { name: 'concurrency_limit', type: 'INTEGER NOT NULL DEFAULT 3' },
      { name: 'created_at', type: 'TEXT NOT NULL' },
      { name: 'updated_at', type: 'TEXT NOT NULL' },
    ]
  },

  // ── TICKET SERVICE ──
  {
    id: 'ticket',
    table: 'ticket',
    service: 'ticket :3002',
    color: '#3a6a9a',
    x: 40, y: 370,
    fields: [
      { name: 'id', type: 'TEXT NOT NULL', pk: true },
      { name: 'project_id', type: 'TEXT NOT NULL', fk: true },
      { name: 'agent_id', type: 'TEXT', fk: true },
      { name: 'title', type: 'TEXT NOT NULL' },
      { name: 'body', type: 'TEXT NOT NULL' },
      { name: 'status', type: "TEXT NOT NULL DEFAULT 'open'" },
      { name: 'priority', type: 'INTEGER NOT NULL DEFAULT 0' },
      { name: 'parent_id', type: 'TEXT', fk: true },
      { name: 'created_by', type: 'TEXT NOT NULL' },
      { name: 'created_at', type: 'TEXT NOT NULL' },
      { name: 'updated_at', type: 'TEXT NOT NULL' },
      { name: 'claimed_at', type: 'TEXT' },
    ]
  },
  {
    id: 'comment',
    table: 'comment',
    service: 'ticket :3002',
    color: '#3a6a9a',
    x: 40, y: 650,
    fields: [
      { name: 'id', type: 'TEXT NOT NULL', pk: true },
      { name: 'ticket_id', type: 'TEXT NOT NULL', fk: true },
      { name: 'author', type: 'TEXT NOT NULL' },
      { name: 'body', type: 'TEXT NOT NULL' },
      { name: 'created_at', type: 'TEXT NOT NULL' },
    ]
  },

  // ── AGENT SERVICE ──
  {
    id: 'agent',
    table: 'agent',
    service: 'agent :3005',
    color: '#6a4a9a',
    x: 450, y: 120,
    fields: [
      { name: 'id', type: 'TEXT NOT NULL', pk: true },
      { name: 'project_id', type: 'TEXT NOT NULL', fk: true },
      { name: 'name', type: 'TEXT NOT NULL' },
      { name: 'model', type: 'TEXT NOT NULL' },
      { name: 'prompt', type: 'TEXT NOT NULL' },
      { name: 'created_at', type: 'TEXT NOT NULL' },
      { name: 'updated_at', type: 'TEXT NOT NULL' },
    ]
  },
  {
    id: 'session',
    table: 'session',
    service: 'agent :3005',
    color: '#6a4a9a',
    x: 450, y: 370,
    fields: [
      { name: 'id', type: 'TEXT NOT NULL', pk: true },
      { name: 'ticket_id', type: 'TEXT NOT NULL', fk: true },
      { name: 'agent_id', type: 'TEXT NOT NULL', fk: true },
      { name: 'status', type: "TEXT NOT NULL DEFAULT 'running'" },
      { name: 'model', type: 'TEXT NOT NULL' },
      { name: 'error', type: 'TEXT' },
      { name: 'tokens_in', type: 'INTEGER' },
      { name: 'tokens_out', type: 'INTEGER' },
      { name: 'cost_usd', type: 'REAL' },
      { name: 'duration_ms', type: 'INTEGER' },
      { name: 'started_at', type: 'TEXT NOT NULL' },
      { name: 'ended_at', type: 'TEXT' },
    ]
  },
  {
    id: 'message',
    table: 'message',
    service: 'agent :3005',
    color: '#6a4a9a',
    x: 450, y: 650,
    fields: [
      { name: 'id', type: 'TEXT NOT NULL', pk: true },
      { name: 'session_id', type: 'TEXT NOT NULL', fk: true },
      { name: 'role', type: 'TEXT NOT NULL' },
      { name: 'content', type: 'TEXT NOT NULL' },
      { name: 'tokens', type: 'INTEGER' },
      { name: 'created_at', type: 'TEXT NOT NULL' },
    ]
  },

  // ── SANDBOX SERVICE ──
  {
    id: 'execution',
    table: 'execution',
    service: 'sandbox :3004',
    color: '#9a6a3a',
    x: 860, y: 280,
    fields: [
      { name: 'id', type: 'TEXT NOT NULL', pk: true },
      { name: 'session_id', type: 'TEXT', fk: true },
      { name: 'command', type: 'TEXT NOT NULL' },
      { name: 'status', type: "TEXT NOT NULL DEFAULT 'running'" },
      { name: 'exit_code', type: 'INTEGER' },
      { name: 'stdout', type: 'TEXT' },
      { name: 'stderr', type: 'TEXT' },
      { name: 'duration_ms', type: 'INTEGER' },
      { name: 'timeout_ms', type: 'INTEGER NOT NULL' },
      { name: 'memory_mb', type: 'INTEGER' },
      { name: 'started_at', type: 'TEXT NOT NULL' },
      { name: 'ended_at', type: 'TEXT' },
    ]
  },
];

const relationships = [
  // project -> ticket (cross-service, logical)
  { from: 'project', to: 'ticket', label: '1 : N', marker: 'cross', dash: true },
  // project -> agent (cross-service, logical)
  { from: 'project', to: 'agent', label: '1 : N', marker: 'cross', dash: true },
  // ticket self-ref
  { from: 'ticket', to: 'ticket', label: 'parent_id', marker: 'ticket', dash: true, self: true },
  // ticket -> comment (intra-service)
  { from: 'ticket', to: 'comment', label: '1 : N', marker: 'ticket', dash: false },
  // ticket -> session (cross-service, logical)
  { from: 'ticket', to: 'session', label: '1 : N', marker: 'cross', dash: true },
  // agent -> session (intra-service)
  { from: 'agent', to: 'session', label: '1 : N', marker: 'agent', dash: false },
  // session -> message (intra-service)
  { from: 'session', to: 'message', label: '1 : N', marker: 'agent', dash: false },
  // session -> execution (cross-service, logical)
  { from: 'session', to: 'execution', label: '1 : N', marker: 'cross', dash: true },
];

const svg = document.getElementById('canvas');
const entitiesG = document.getElementById('entities');
const relsG = document.getElementById('relationships');

entities.forEach(e => {
  e.w = COL_W;
  e.h = HEADER_H + e.fields.length * ROW_H + PAD + 2;
});

function renderEntities() {
  entitiesG.innerHTML = '';
  entities.forEach(e => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('entity');
    g.setAttribute('transform', `translate(${e.x}, ${e.y})`);

    // Box
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.classList.add('entity-box');
    rect.setAttribute('width', e.w);
    rect.setAttribute('height', e.h);
    rect.setAttribute('fill', '#0f0f18');
    rect.setAttribute('stroke', e.color + '40');
    g.appendChild(rect);

    // Header bg
    const hbar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    hbar.setAttribute('width', e.w);
    hbar.setAttribute('height', HEADER_H);
    hbar.setAttribute('fill', e.color + '12');
    hbar.setAttribute('rx', '6');
    hbar.setAttribute('ry', '6');
    g.appendChild(hbar);
    const hbar2 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    hbar2.setAttribute('y', HEADER_H - 6);
    hbar2.setAttribute('width', e.w);
    hbar2.setAttribute('height', 6);
    hbar2.setAttribute('fill', e.color + '12');
    g.appendChild(hbar2);

    // Divider
    const div = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    div.classList.add('divider');
    div.setAttribute('x1', 0); div.setAttribute('y1', HEADER_H);
    div.setAttribute('x2', e.w); div.setAttribute('y2', HEADER_H);
    g.appendChild(div);

    // Table name
    const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    title.classList.add('entity-header');
    title.setAttribute('x', PAD);
    title.setAttribute('y', 19);
    title.setAttribute('fill', e.color);
    title.textContent = e.table;
    g.appendChild(title);

    // Service badge
    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    badge.classList.add('service-badge');
    badge.setAttribute('x', e.w - PAD);
    badge.setAttribute('y', 19);
    badge.setAttribute('text-anchor', 'end');
    badge.textContent = e.service;
    g.appendChild(badge);

    // Fields
    e.fields.forEach((f, i) => {
      const y = HEADER_H + 13 + i * ROW_H;

      // Field name
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.classList.add('entity-field');
      if (f.pk) txt.classList.add('pk');
      else if (f.fk) txt.classList.add('fk');
      txt.setAttribute('x', PAD);
      txt.setAttribute('y', y);
      const prefix = f.pk ? '\u25C9 ' : f.fk ? '\u25CB ' : '  ';
      txt.textContent = `${prefix}${f.name}`;
      g.appendChild(txt);

      // Type
      const typ = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      typ.classList.add('entity-field', 'entity-field-type');
      typ.setAttribute('x', TYPE_X);
      typ.setAttribute('y', y);
      typ.textContent = f.type;
      g.appendChild(typ);
    });

    entitiesG.appendChild(g);

    // Dragging
    let dragging = false, ox, oy;
    g.addEventListener('mousedown', (ev) => {
      dragging = true;
      ox = ev.clientX - e.x;
      oy = ev.clientY - e.y;
      ev.preventDefault();
    });
    window.addEventListener('mousemove', (ev) => {
      if (!dragging) return;
      e.x = ev.clientX - ox;
      e.y = ev.clientY - oy;
      g.setAttribute('transform', `translate(${e.x}, ${e.y})`);
      renderRelationships();
    });
    window.addEventListener('mouseup', () => { dragging = false; });
  });
}

function getEntity(id) { return entities.find(e => e.id === id); }

function getAnchor(entity, side) {
  if (side === 'left') return { x: entity.x, y: entity.y + entity.h / 2 };
  if (side === 'right') return { x: entity.x + entity.w, y: entity.y + entity.h / 2 };
  if (side === 'top') return { x: entity.x + entity.w / 2, y: entity.y };
  if (side === 'bottom') return { x: entity.x + entity.w / 2, y: entity.y + entity.h };
}

function renderRelationships() {
  relsG.innerHTML = '';

  relationships.forEach(rel => {
    const from = getEntity(rel.from);
    const to = getEntity(rel.to);
    const strokeColor = rel.dash ? '#444' : (from.color + '88');

    if (rel.self) {
      const x = from.x + from.w;
      const y1 = from.y + HEADER_H + 4;
      const y2 = from.y + HEADER_H + 4 + 7 * ROW_H;
      const bulge = 30;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.classList.add('relation-line');
      path.setAttribute('d', `M${x},${y1} C${x+bulge},${y1} ${x+bulge},${y2} ${x},${y2}`);
      path.setAttribute('stroke', strokeColor);
      if (rel.dash) path.setAttribute('stroke-dasharray', '3,2');
      path.setAttribute('marker-end', `url(#arrow-${rel.marker})`);
      relsG.appendChild(path);

      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.classList.add('relation-label');
      label.setAttribute('x', x + bulge + 4);
      label.setAttribute('y', (y1 + y2) / 2 + 3);
      label.textContent = rel.label;
      relsG.appendChild(label);
      return;
    }

    const fcx = from.x + from.w / 2;
    const tcx = to.x + to.w / 2;
    const fcy = from.y + from.h / 2;
    const tcy = to.y + to.h / 2;
    const dx = Math.abs(tcx - fcx);
    const dy = Math.abs(tcy - fcy);

    let fromSide, toSide;
    if (dx > dy) {
      fromSide = tcx > fcx ? 'right' : 'left';
      toSide = tcx > fcx ? 'left' : 'right';
    } else {
      fromSide = tcy > fcy ? 'bottom' : 'top';
      toSide = tcy > fcy ? 'top' : 'bottom';
    }

    const a = getAnchor(from, fromSide);
    const b = getAnchor(to, toSide);

    const cx1 = (fromSide === 'left' || fromSide === 'right') ? a.x + (b.x - a.x) * 0.5 : a.x;
    const cy1 = (fromSide === 'top' || fromSide === 'bottom') ? a.y + (b.y - a.y) * 0.5 : a.y;
    const cx2 = (toSide === 'left' || toSide === 'right') ? b.x - (b.x - a.x) * 0.5 : b.x;
    const cy2 = (toSide === 'top' || toSide === 'bottom') ? b.y - (b.y - a.y) * 0.5 : b.y;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.classList.add('relation-line');
    path.setAttribute('d', `M${a.x},${a.y} C${cx1},${cy1} ${cx2},${cy2} ${b.x},${b.y}`);
    path.setAttribute('stroke', strokeColor);
    if (rel.dash) path.setAttribute('stroke-dasharray', '3,2');
    path.setAttribute('marker-end', `url(#arrow-${rel.marker})`);
    path.setAttribute('marker-start', `url(#dot-${rel.marker})`);
    relsG.appendChild(path);

    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2 - 5;
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.classList.add('relation-label');
    label.setAttribute('x', mx);
    label.setAttribute('y', my);
    label.setAttribute('text-anchor', 'middle');
    label.textContent = rel.label;
    relsG.appendChild(label);
  });
}

renderEntities();
renderRelationships();
</script>
</body>
</html>
