# Development config — no SSL, plain HTTP on port 3000
events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  upstream project  { server project:3001; }
  upstream ticket   { server ticket:3002; }
  upstream repo     { server repo:3003; }
  upstream sandbox  { server sandbox:3004; }
  upstream agent    { server agent:3005; }

  server {
    listen 3000;
    server_name _;

    location /project {
      proxy_pass http://project;
      proxy_set_header Host $host;
    }

    location /ticket {
      proxy_pass http://ticket;
      proxy_set_header Host $host;
    }

    location /repo {
      proxy_pass http://repo;
      proxy_set_header Host $host;
      proxy_read_timeout 300;
      proxy_send_timeout 300;
    }

    location /sandbox {
      proxy_pass http://sandbox;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_set_header   Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding on;
    }

    location /agent {
      proxy_pass http://agent;
      proxy_read_timeout 3600;
    }

    location / {
      proxy_pass http://web:3006;
    }
  }
}
