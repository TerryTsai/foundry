events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Increase body size for file writes via repo service
  client_max_body_size 50m;

  # Upstream services
  upstream project  { server project:3001; }
  upstream ticket   { server ticket:3002; }
  upstream repo     { server repo:3003; }
  upstream sandbox  { server sandbox:3004; }
  upstream agent    { server agent:3005; }

  server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    # SSL — certs managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/foundry/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foundry/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Service routing
    location /project {
      proxy_pass http://project;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /ticket {
      proxy_pass http://ticket;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /repo {
      proxy_pass http://repo;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Git wire protocol needs these
      proxy_read_timeout 300;
      proxy_send_timeout 300;
    }

    location /sandbox {
      proxy_pass http://sandbox;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # SSE requires no buffering
      proxy_buffering    off;
      proxy_cache        off;
      proxy_set_header   Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding on;
    }

    location /agent {
      proxy_pass http://agent;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Long-running sessions
      proxy_read_timeout 3600;
    }

    # Static web app — catch-all
    location / {
      proxy_pass http://web:3006;
      proxy_set_header Host $host;
      # SPA fallback handled by web container's nginx
    }
  }
}
