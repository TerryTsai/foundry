events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  upstream project  { server project:3001; }
  upstream ticket   { server ticket:3002; }
  upstream repo     { server repo:3003; }
  upstream sandbox  { server sandbox:3004; }
  upstream agent    { server agent:3005; }
  upstream web      { server web:3006; }

  server {
    listen 80;
    server_name _;

    location ~ ^/project(/|$) {
      proxy_pass http://project;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/ticket(/|$) {
      proxy_pass http://ticket;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/repo/ {
      proxy_pass http://repo;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 300;
      proxy_send_timeout 300;
    }

    location ~ ^/sandbox(/|$) {
      proxy_pass http://sandbox;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_set_header   Connection '';
      proxy_http_version 1.1;
    }

    location ~ ^/agent(/|$) {
      proxy_pass http://agent;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600;
    }

    location /session {
      proxy_pass http://agent;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /log/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }
  }
}
